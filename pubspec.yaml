name: guitar_buddy
description: "Guitar companion app"
publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  google_fonts: ^8.0.2
  material_symbols_icons: ^4.2906.0
  sqlite3: ^3.1.6
  sqflite_common_ffi: ^2.4.0+2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  record: ^7.1.1
  audioplayers: ^6.8.1
  permission_handler: ^12.0.1
  fl_chart: ^1.2.0
  open_file: ^4.0.0

  pitchupdart:
    git:
      url: https://github.com/duskygloom/pitchup_dart
      ref: master
    # path: ../pitchup_dart
    
  pitch_detector_dart:
    # git:
    #   url: https://github.com/duskygloom/pitch_detector_dart
    #   ref: master
    path: ../pitch_detector_dart

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  fastforge:
    git:
      url: https://github.com/duskygloom/flutter_distributor
      ref: hans
      path: packages/fastforge
    # path: ../flutter_distributor/packages/fastforge

flutter:
  uses-material-design: true

  assets:
    - assets/audio/tick.wav
